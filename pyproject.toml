[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsake-cli"
version = "0.1.0"
description = "A command-line password manager with TOTP options and recovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jack" }
]
keywords = ["password-manager", "cli", "security", "totp", "encryption", "argon2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "pyotp>=2.9.0",
    "pyperclip>=1.9.0",
    "mnemonic>=0.21",
    "qrcode>=7.4.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/keepsake"
Issues = "https://github.com/yourusername/keepsake/issues"

[project.scripts]
keepsake = "KeepSake:main"

[tool.setuptools]
py-modules = ["KeepSake"]
